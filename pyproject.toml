[project]
name = "electric-mobility-platform"
version = "0.1.0"
description = "Plateforme de données sur la mobilité électrique et l'énergie — projet fil rouge Data Engineering AWS"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "polars>=1.0.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "jupyterlab>=4.0.0"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
